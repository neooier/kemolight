[package]
name = "kemolight"
version = "0.1.0"
edition = "2021"
description = "A lightweight egui brightness controller for Linux and Windows desktops."
license = "MIT OR Apache-2.0"

[features]
default = ["tray", "linux-ddcutil", "mock-backend"]
tray = ["dep:ksni"]
linux-ddcutil = []
mock-backend = []
wayland = ["eframe/wayland", "winit/wayland"]
renderer-wgpu = ["eframe/wgpu"]

[dependencies]
directories = "6.0"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tempfile = "3.23"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.5", optional = true, default-features = false, features = ["async-io", "blocking"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
serde_json = "1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
